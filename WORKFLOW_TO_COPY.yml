name: SOTE stock watcher

on:
  schedule:
    # UTC minutes 17 and 47; avoids the busiest top-of-hour period.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'First choose test; then status for your first scan.'
        required: true
        default: test
        type: choice
        options:
          - test
          - status
          - scan
          - dry-run

# Required only for the observation-history branch. No personal access token needed.
permissions:
  contents: write

# Prevent simultaneous scans racing the alert history.
concurrency:
  group: sote-tracker
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Get tracker files
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the two dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run safety tests
        run: python -m unittest discover -s tests -v
      - name: Scan stores or send a connection test
        env:
          TRACKER_MODE: ${{ inputs.mode || 'scan' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: leave all Reddit settings empty for the initial retailer-only setup.
          REDDIT_APPROVED: ${{ vars.REDDIT_APPROVED }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_REFRESH_TOKEN: ${{ secrets.REDDIT_REFRESH_TOKEN }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
        run: python tracker.py --mode "$TRACKER_MODE"
